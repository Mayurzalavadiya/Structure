[versions]
androidGradlePlugin = "8.13.2"
barcodeScanning = "17.3.0"
cameraCamera2 = "1.4.2"
firebaseMessaging = "24.1.1"
javaWebsocket = "1.5.2"
kotlin = "1.9.22"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.2.0"
coroutines = "1.7.3"
hilt = "2.48"
googleServices = "4.3.15"
lifecycle = "2.8.7"
lifecycleExtensions = "2.2.0"
retrofit = "2.9.0"
okhttp = "4.10.0"
fragment = "1.8.5"
roomRuntime = "2.6.1"
rxandroid = "2.1.1"
rxjava = "2.2.21"
ssp = "1.1.0"
sdp = "1.1.0"
glide = "4.14.1"
glideCompiler = "4.13.2"
stompprotocolandroid = "1.6.6"
swiperefreshlayout = "1.1.0"
workRuntimeKtx = "2.9.0"

[plugins]
androidApplication = { id = "com.android.application", version.ref = "androidGradlePlugin" }
androidLibrary = { id = "com.android.library", version.ref = "androidGradlePlugin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
hiltAndroid = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
googleservices = { id = "com.google.gms.google-services", version.ref = "googleServices" }


[libraries]
barcodeScanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "barcodeScanning" }
cameraCamera2 = { module = "androidx.camera:camera-camera2", version.ref = "cameraCamera2" }
cameraLifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "cameraCamera2" }
cameraView = { module = "androidx.camera:camera-view", version.ref = "cameraCamera2" }
firebaseMessaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebaseMessaging" }
javaWebsocket = { module = "org.java-websocket:Java-WebSocket", version.ref = "javaWebsocket" }
kotlinStdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk7", version.ref = "kotlin" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
appcompatResources = { module = "androidx.appcompat:appcompat-resources", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }

# Coroutines
kotlinCoroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinCoroutinesAndroid = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# Hilt
hiltAndroid = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hiltCompiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }

# Lifecycle components
lifecycleRuntimeKtx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycleExtensions = { module = "androidx.lifecycle:lifecycle-extensions", version.ref = "lifecycleExtensions" }
lifecycleReactivestreamsKtx = { module = "androidx.lifecycle:lifecycle-reactivestreams-ktx", version.ref = "lifecycle" }
lifecycleViewmodelKtx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycleCommonJava8 = { module = "androidx.lifecycle:lifecycle-common-java8", version.ref = "lifecycle" }

# Retrofit
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofitGson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okhttpLoggingInterceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

# KTX
fragmentKtx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }

# Fonts Size
roomKtx = { module = "androidx.room:room-ktx", version.ref = "roomRuntime" }
roomCompiler = { module = "androidx.room:room-compiler", version.ref = "roomRuntime" }
roomRuntime = { module = "androidx.room:room-runtime", version.ref = "roomRuntime" }
rxandroid = { module = "io.reactivex.rxjava2:rxandroid", version.ref = "rxandroid" }
rxjava = { module = "io.reactivex.rxjava2:rxjava", version.ref = "rxjava" }
ssp = { module = "com.intuit.ssp:ssp-android", version.ref = "ssp" }
sdp = { module = "com.intuit.sdp:sdp-android", version.ref = "sdp" }

# Glide
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glideCompiler = { module = "com.github.bumptech.glide:compiler", version.ref = "glideCompiler" }
stompprotocolandroid = { module = "com.github.NaikSoftware:StompProtocolAndroid", version.ref = "stompprotocolandroid" }
swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
workRuntimeKtx = { module = "androidx.work:work-runtime-ktx", version.ref = "workRuntimeKtx" }
